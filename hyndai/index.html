<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Сетка дашборда</title>
  </head>
  <body>
    <div class="dashboard">
      <!-- Верхняя часть -->
      <div class="top-section">
        <!-- БОЛЬШОЙ БЛОК с диаграммой -->
        <div class="big-block">
          <div class="chart-container">
            <!-- Общая сумма (левый верхний угол) -->
            <div class="total-amount">
              💰 <span id="totalSpent">15 420</span> ₽
            </div>

            <!-- Холст для круговой диаграммы -->
            <canvas id="expenseChart" width="200" height="200"></canvas>

            <!-- Легенда (справа или снизу) -->
            <div class="legend" id="legendContainer">
              <!-- Сюда JS добавит участников -->
            </div>
          </div>
        </div>

        <!-- Правая колонка (А и Б) -->
        <div class="right-column">
          <!-- БЛОК А: Задолженности -->
          <div class="small-block top">
            <div class="debt-container">
              <div class="debt-title">📋 Задолженности</div>
              <div class="debt-list" id="debtList">
                <!-- Сюда JS добавит записи -->
              </div>
              <div class="debt-total" id="debtTotal">Итого: 0 ₽</div>
            </div>
          </div>
          <div class="small-block bottom">БЛОК Б</div>
        </div>
      </div>

      <!-- Нижняя часть -->
      <div class="bottom-section">
        <div class="long-block">
          <!-- ВКЛАДКИ -->
          <div class="tabs">
            <button class="tab active" data-tab="expense">Расход</button>
            <button class="tab" data-tab="repay">Вернуть долг</button>
          </div>

          <!-- КОНТЕНТ ВКЛАДКИ "РАСХОД" -->
          <div class="tab-content active" id="tabExpense">
            <div class="expense-form">
              <div class="form-group">
                <label>Сумма</label>
                <input type="number" id="expenseAmount" placeholder="0" />
              </div>
              <div class="form-group">
                <label>Категория</label>
                <select id="expenseCategory">
                  <option value="еда">🍔 Еда</option>
                  <option value="транспорт">🚗 Транспорт</option>
                  <option value="развлечения">🎮 Развлечения</option>
                  <option value="услуги">🛠 Услуги</option>
                  <option value="другое">📌 Другое</option>
                </select>
              </div>
              <div class="form-group">
                <label>Кто платил</label>
                <select id="expensePayer">
                  <option value="Маша">Маша</option>
                  <option value="Петя">Петя</option>
                  <option value="Оля">Оля</option>
                  <option value="Коля">Коля</option>
                  <option value="Дима">Дима</option>
                </select>
              </div>
              <button class="add-btn" id="addExpenseBtn">➕ Добавить</button>
            </div>
          </div>

          <!-- КОНТЕНТ ВКЛАДКИ "ВЕРНУТЬ ДОЛГ" -->
          <div class="tab-content" id="tabRepay">
            <div class="repay-form">
              <div class="form-group">
                <label for="repayFrom">Кто возвращает</label>
                <select id="repayFrom">
                  <option value="Маша">Маша</option>
                  <option value="Петя">Петя</option>
                  <option value="Оля">Оля</option>
                  <option value="Коля">Коля</option>
                  <option value="Дима">Дима</option>
                </select>
              </div>
              <div class="form-group">
                <label for="repayTo">Кому</label>
                <select id="repayTo">
                  <option value="Петя">Петя</option>
                  <option value="Маша">Маша</option>
                  <option value="Оля">Оля</option>
                  <option value="Коля">Коля</option>
                  <option value="Дима">Дима</option>
                </select>
              </div>
              <div class="form-group">
                <label for="repayAmount">Сумма</label>
                <input type="number" id="repayAmount" min="1" step="1" placeholder="0" />
              </div>
              <button class="add-btn" id="repayDebtBtn" type="button">↩️ Вернуть</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Подключаем JS -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
